name: DIAN Citas Monitor

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "dian_monitor.py"
      - "requirements.txt"
      - ".github/workflows/dian-monitor.yml"
  schedule:
    # GitHub schedules are best-effort. Start a fresh runner at :17 each hour,
    # while the current runner keeps checking every minute for several hours.
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: dian-citas-monitor
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Continuously monitor DIAN approximately every minute
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHECKS_PER_RUN: "300"
          INTERVAL_SECONDS: "60"
        run: python dian_monitor.py

      - name: Upload evidence if availability may exist
        if: always() && hashFiles('dian_posible_disponibilidad.png') != ''
        uses: actions/upload-artifact@v4
        with:
          name: dian-posible-disponibilidad
          path: |
            dian_posible_disponibilidad.png
            dian_posible_disponibilidad_full.png
            dian_posible_disponibilidad.html
            dian_posible_disponibilidad.txt
          retention-days: 7
