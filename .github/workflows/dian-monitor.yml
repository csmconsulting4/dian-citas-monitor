name: DIAN Citas Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: dian-citas-monitor
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Monitor DIAN approximately every minute
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHECKS_PER_RUN: "5"
          INTERVAL_SECONDS: "60"
        run: python dian_monitor.py

      - name: Upload screenshot if availability may exist
        if: always() && hashFiles('dian_posible_disponibilidad.png') != ''
        uses: actions/upload-artifact@v4
        with:
          name: dian-posible-disponibilidad
          path: dian_posible_disponibilidad.png
          retention-days: 7
